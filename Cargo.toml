[workspace]
resolver = "3"
members = [
    "crates/shepsky-core",
    "crates/shepsky-bridge",
    "crates/shepsky-client",
    "crates/shepsky-android",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shepsky-core = { path = "crates/shepsky-core" }

# Small, fast release builds (the phone's .so and the bridge). Unwinding
# stays on: a panicking task is contained instead of taking the app or the
# bridge down with it.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
